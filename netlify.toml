# Destinations Guild Travel — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"

# Concierge helper: pretty address /api/polo-polly -> function
[[redirects]]
  from = "/api/polo-polly"
  to = "/.netlify/functions/polo-polly"
  status = 200

# Safety blocks for any stray private files from earlier deploys (harmless once files are gone)
[[redirects]]
  from = "/guild_project_profile.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/files.zip"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_city-template.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/guildwebsitedeployjul18*"
  to = "/404.html"
  status = 404
  force = true

# Friends page renamed 2026-08-18 — always "Guild Hospitality", never "Guild" alone
[[redirects]]
  from = "/friends-of-the-guild.html"
  to = "/friends-of-guild-hospitality.html"
  status = 301
  force = true
[[redirects]]
  from = "/friends-of-the-guild"
  to = "/friends-of-guild-hospitality.html"
  status = 301
  force = true

# ── Superseded drafts, 1 Sep 2026 ──────────────────────────────────────────
